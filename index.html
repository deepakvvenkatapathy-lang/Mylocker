<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python OOP — Learn &amp; Practice</title>

<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>

<style>
  :root{
    --bg1:#1e1b4b; --bg2:#312e81; --accent:#f472b6; --accent2:#a78bfa;
    --card:#ffffff; --text-dark:#1f2333; --good:#22c55e; --bulb:#fbbf24;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2) 60%,#701a75);
    color:#eef;min-height:100vh;padding-bottom:60px;}
  header{text-align:center;padding:36px 20px 10px;}
  header h1{font-size:2.1rem;margin:0 0 6px;
    background:linear-gradient(90deg,#f472b6,#a78bfa,#60a5fa);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  header p{color:#c7c9e0;margin:0;font-size:.95rem;}

  .tabbar{display:flex;justify-content:center;gap:12px;margin:24px auto 26px;flex-wrap:wrap;padding:0 16px;}
  .tab{background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.22);
    color:#e9e9ff;padding:12px 28px;border-radius:30px;font-size:1rem;font-weight:700;
    cursor:pointer;transition:all .25s;}
  .tab:hover{background:rgba(255,255,255,.18);transform:translateY(-2px);}
  .tab.active{background:linear-gradient(135deg,#f472b6,#a78bfa);border-color:transparent;
    color:#fff;box-shadow:0 6px 20px rgba(244,114,182,.45);}
  .tabpanel{display:none;}
  .tabpanel.active{display:block;animation:fadeIn .35s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .container{max-width:920px;margin:0 auto;padding:0 18px;display:flex;flex-direction:column;gap:26px;}
  #progress{text-align:center;font-size:1.05rem;margin:0 auto 24px;color:#fef08a;font-weight:600;}

  /* ---------- QUIZ ---------- */
  .card{background:var(--card);color:var(--text-dark);border-radius:16px;padding:22px 24px 26px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);border:2px solid transparent;transition:border-color .3s;}
  .card.solved{border-color:var(--good);}
  .qtitle{font-size:1.15rem;font-weight:700;color:#312e81;}
  .qbadge{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:20px;margin-left:8px;text-transform:uppercase;}
  .badge-easy{background:#d1fae5;color:#047857;}
  .badge-medium{background:#fef3c7;color:#b45309;}
  .qdesc{font-size:.95rem;color:#374151;margin:8px 0 6px;line-height:1.6;}
  .goal{background:#f1f5f9;border-left:4px solid #64748b;padding:8px 12px;border-radius:8px;
    font-size:.85rem;color:#334155;margin:0 0 14px;font-family:monospace;}
  .btnrow{display:flex;align-items:center;gap:10px;margin:4px 0 14px;flex-wrap:wrap;}
  .icon-btn{border:none;cursor:pointer;border-radius:50%;width:44px;height:44px;font-size:1.3rem;
    display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.25);transition:transform .15s;}
  .icon-btn:hover{transform:scale(1.08);} .icon-btn:active{transform:scale(.94);}
  .hint-btn{background:radial-gradient(circle at 35% 30%,#fff7cc,var(--bulb) 70%);color:#78350f;animation:pulseGlow 1.6s infinite;}
  @keyframes pulseGlow{0%{box-shadow:0 0 0 0 rgba(251,191,36,.7);}70%{box-shadow:0 0 0 12px rgba(251,191,36,0);}100%{box-shadow:0 0 0 0 rgba(251,191,36,0);}}
  .answer-btn{background:linear-gradient(135deg,#a78bfa,#818cf8);color:#fff;}
  .run-btn{background:linear-gradient(135deg,#34d399,#059669);color:#fff;border:none;border-radius:10px;
    padding:10px 20px;font-size:.95rem;font-weight:700;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25);}
  .hint-tag,.answer-tag{font-size:.8rem;color:#6b7280;font-weight:600;}
  textarea{width:100%;min-height:150px;background:#0f172a;color:#e2e8f0;
    font-family:'Consolas','Courier New',monospace;font-size:.92rem;border-radius:10px;
    border:1px solid #334155;padding:14px;resize:vertical;line-height:1.5;}
  .hintbox{display:none;margin-top:10px;background:#fffbeb;border-left:4px solid var(--bulb);padding:10px 14px;border-radius:8px;font-size:.9rem;color:#78350f;}
  .answerbox{display:none;margin-top:10px;background:#eef2ff;border-left:4px solid var(--accent2);padding:12px 14px;border-radius:8px;font-size:.88rem;color:#312e81;}
  .answerbox pre{background:#1e1b4b;color:#e0e7ff;padding:10px;border-radius:8px;overflow-x:auto;font-size:.82rem;}
  .result{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:.9rem;font-weight:600;white-space:pre-wrap;display:none;}
  .result.ok{display:block;background:#dcfce7;color:#166534;border:1px solid #86efac;}
  .result.err{display:block;background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;}
  .out-label{font-weight:700;display:block;margin-bottom:4px;}

  /* ---------- STORY ---------- */
  .story-intro{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    border-radius:16px;padding:22px 26px;line-height:1.8;font-size:1rem;color:#e6e6ff;}
  .story-intro h2{margin-top:0;color:#fbcfe8;font-size:1.35rem;}
  .story-card{background:var(--card);color:var(--text-dark);border-radius:16px;padding:24px 26px 28px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);border-left:8px solid var(--accent2);}
  .story-card h3{margin:0 0 4px;font-size:1.25rem;color:#312e81;}
  .chapter{font-size:.75rem;letter-spacing:1.5px;font-weight:800;color:#a78bfa;text-transform:uppercase;}
  .story-card .scene{background:#fdf2f8;border-left:4px solid var(--accent);padding:14px 16px;
    border-radius:10px;margin:14px 0;font-size:.97rem;line-height:1.85;color:#500724;}
  .simple{background:#eff6ff;border-left:4px solid #3b82f6;padding:12px 16px;border-radius:10px;
    margin:14px 0;font-size:.97rem;line-height:1.8;color:#1e3a8a;}
  .simple b{color:#1d4ed8;}
  .story-card .takeaway{background:#ecfdf5;border-left:4px solid var(--good);padding:12px 16px;
    border-radius:10px;margin:14px 0 0;font-size:.93rem;color:#065f46;line-height:1.7;}
  .story-card p{line-height:1.8;font-size:.95rem;color:#374151;}
  .story-card pre{background:#1e1b4b;color:#e0e7ff;padding:14px;border-radius:10px;overflow-x:auto;
    font-size:.84rem;line-height:1.6;font-family:'Consolas','Courier New',monospace;}
  .out-note{font-size:.86rem;color:#6b7280;font-style:italic;margin-top:-4px;}
  .word{background:#fef3c7;padding:1px 6px;border-radius:4px;font-family:monospace;font-size:.88em;color:#78350f;}

  /* ---------- SCENE PLAYER ("video") ---------- */
  .player{border-radius:14px;overflow:hidden;border:1px solid #3730a3;margin:16px 0 8px;
    background:linear-gradient(160deg,#0f172a,#1e1b4b);}
  .pbar{display:flex;align-items:center;justify-content:space-between;
    padding:8px 12px;background:rgba(255,255,255,.06);font-size:.74rem;color:#a5b4fc;
    font-weight:700;letter-spacing:1px;text-transform:uppercase;}
  .dots{display:flex;gap:6px;}
  .dot{width:8px;height:8px;border-radius:50%;background:#4338ca;transition:all .3s;}
  .dot.on{background:#f472b6;transform:scale(1.3);}
  .pstage{min-height:190px;display:flex;align-items:center;justify-content:center;
    gap:16px;padding:18px 16px;flex-wrap:wrap;}
  .pnarr{background:rgba(0,0,0,.35);padding:12px 16px;color:#e0e7ff;font-size:.93rem;
    line-height:1.6;min-height:58px;border-top:1px solid #3730a3;}
  .pnarr b{color:#fbbf24;}
  .pctrl{display:flex;gap:8px;align-items:center;padding:10px 12px;background:rgba(255,255,255,.04);}
  .pctrl button{background:#4338ca;border:none;color:#e0e7ff;border-radius:8px;padding:7px 14px;
    font-size:.82rem;font-weight:700;cursor:pointer;transition:.2s;}
  .pctrl button:hover{background:#6366f1;}
  .pctrl .play{background:linear-gradient(135deg,#f472b6,#a78bfa);}
  .pctrl .step-lbl{margin-left:auto;font-size:.76rem;color:#a5b4fc;}

  .obj{font-size:46px;line-height:1;animation:pop .45s ease both;}
  .obj.sm{font-size:34px;}
  .box{background:#fef3c7;color:#78350f;border-radius:8px;padding:8px 12px;font-size:.78rem;
    font-weight:700;font-family:monospace;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.4);
    animation:pop .45s ease both;}
  .box.dark{background:#312e81;color:#e0e7ff;}
  .box.green{background:#065f46;color:#d1fae5;}
  .box.pink{background:#9d174d;color:#fce7f3;}
  .box.grey{background:#374151;color:#d1d5db;}
  .arrow{color:#a78bfa;font-size:28px;animation:pop .45s ease both;}
  .col{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .tag{font-size:.68rem;color:#818cf8;letter-spacing:.5px;}
  @keyframes pop{0%{opacity:0;transform:scale(.5) translateY(14px);}70%{transform:scale(1.08);}100%{opacity:1;transform:scale(1);}}
  .fade{animation:fadeS .5s ease both;}
  @keyframes fadeS{from{opacity:0;}to{opacity:1;}}

  /* ---------- HEART BOMB ---------- */
  #heart-overlay{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;}
  .heart{position:absolute;bottom:-40px;font-size:28px;animation:floatUp 1.8s ease-out forwards;}
  @keyframes floatUp{0%{transform:translateY(0) scale(.6);opacity:1;}100%{transform:translateY(-100vh) scale(1.3) rotate(25deg);opacity:0;}}
  .best-msg{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);font-size:2.4rem;font-weight:800;
    color:#fff;text-shadow:0 0 20px #f472b6,0 0 40px #a78bfa;z-index:10000;opacity:0;
    animation:popMsg 2s ease forwards;pointer-events:none;text-align:center;}
  @keyframes popMsg{0%{opacity:0;transform:translate(-50%,-50%) scale(.3);}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15);}35%{transform:translate(-50%,-50%) scale(1);}80%{opacity:1;}100%{opacity:0;}}
  footer{text-align:center;color:#c7c9e0;font-size:.85rem;margin-top:40px;padding:0 18px;}
</style>
</head>
<body>

<header>
  <h1>🐍 Python OOP — Learn &amp; Practice</h1>
  <p>Made for absolute beginners. Watch the scene play step by step, then try the code yourself.</p>
</header>

<div class="tabbar">
  <button class="tab active" id="tab-quiz" onclick="switchTab('quiz')">📝 Quiz</button>
  <button class="tab" id="tab-story" onclick="switchTab('story')">📖 Explanation</button>
</div>

<div class="tabpanel active" id="panel-quiz">
  <div id="progress">Solved: 0 / 10</div>
  <div class="container" id="quiz-container"></div>
  <footer>Tip: click 💡 for hints, 📖 for the full answer. Get it right to see the magic ✨</footer>
</div>

<div class="tabpanel" id="panel-story">
  <div class="container" id="story-container"></div>
</div>

<div id="heart-overlay"></div>

<script>
/* ============================================================
   TAB SWITCHING
   ============================================================ */
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tabpanel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ============================================================
   SCENE PLAYER — plays each scene step by step, like a short video
   ============================================================ */
const players = {};

function makePlayer(id, steps){
  players[id] = {steps:steps, i:0, timer:null, playing:false};
  return `
  <div class="player" id="player-${id}">
    <div class="pbar">
      <span>▶ Scene ${id}</span>
      <span class="dots" id="dots-${id}"></span>
    </div>
    <div class="pstage" id="stage-${id}"></div>
    <div class="pnarr" id="narr-${id}"></div>
    <div class="pctrl">
      <button class="play" onclick="playScene(${id})">▶ Play</button>
      <button onclick="stepScene(${id},-1)">◀ Back</button>
      <button onclick="stepScene(${id},1)">Next ▶</button>
      <span class="step-lbl" id="lbl-${id}"></span>
    </div>
  </div>`;
}

function renderStep(id){
  const p = players[id];
  const s = p.steps[p.i];
  document.getElementById('stage-'+id).innerHTML = s.html;
  document.getElementById('narr-'+id).innerHTML = s.narr;
  document.getElementById('lbl-'+id).textContent = `Step ${p.i+1} of ${p.steps.length}`;
  const dots = p.steps.map((_,k)=>`<span class="dot ${k===p.i?'on':''}"></span>`).join('');
  document.getElementById('dots-'+id).innerHTML = dots;
}

function stepScene(id, dir){
  const p = players[id];
  clearInterval(p.timer); p.playing=false;
  p.i = Math.min(p.steps.length-1, Math.max(0, p.i+dir));
  renderStep(id);
}

function playScene(id){
  const p = players[id];
  clearInterval(p.timer);
  p.i = 0; renderStep(id); p.playing = true;
  p.timer = setInterval(()=>{
    if(p.i >= p.steps.length-1){ clearInterval(p.timer); p.playing=false; return; }
    p.i++; renderStep(id);
  }, 3000);
}

function escapeHtml(text){
  const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};
  return text.replace(/[&<>"']/g, m => map[m]);
}

function celebrateWin(){
  const overlay = document.getElementById('heart-overlay');
  for(let i=0;i<8;i++){
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.textContent = '❤️';
    heart.style.left = Math.random()*100+'%';
    overlay.appendChild(heart);
    setTimeout(()=>heart.remove(), 1800);
  }
  const msg = document.createElement('div');
  msg.className = 'best-msg';
  msg.textContent = '✨ PERFECT! ✨';
  document.body.appendChild(msg);
  setTimeout(()=>msg.remove(), 2000);
}

/* ============================================================
   SCENES — one per concept, 4–5 simple steps each
   ============================================================ */
const scenes = {
1:[
 {html:`<div class="col"><div class="obj">📋</div><div class="box">RECIPE CARD</div><span class="tag">stuck near the stove</span></div>`,
  narr:`A tea recipe is written on a <b>card</b>. It is only paper. It tells you how to make tea.`},
 {html:`<div class="col"><div class="obj">📋</div><div class="box">RECIPE CARD</div></div><span class="arrow">➜</span><div class="col"><div class="obj">☕</div><div class="box green">CUP 1</div></div>`,
  narr:`A customer comes. You read the card and make <b>one real cup</b>.`},
 {html:`<div class="col"><div class="obj">📋</div><div class="box">RECIPE CARD</div></div><span class="arrow">➜</span><div class="col"><div class="obj">☕</div><div class="box green">CUP 1</div>&nbsp;<div class="obj">☕</div><div class="box green">CUP 2</div>&nbsp;<div class="obj">☕</div><div class="box green">CUP 3</div></div>`,
  narr:`More customers come. Same card → <b>many real cups</b>. The card is never used up.`},
 {html:`<div class="col"><div class="obj">📋</div><div class="box grey">you can't drink this</div></div><span class="arrow">vs</span><div class="col"><div class="obj">☕</div><div class="box green">you can drink this</div></div>`,
  narr:`Remember this: you cannot <b>drink the card</b>. You drink the cup.`},
 {html:`<div class="col"><div class="obj">📋</div><div class="box dark">class Tea:</div><span class="tag">= the CARD</span></div><span class="arrow">➜</span><div class="col"><div class="obj">☕</div><div class="box green">cup = Tea()</div><span class="tag">= the CUP</span></div>`,
  narr:`In Python: the card is a <b>class</b>. The cup is an <b>object</b>. That's the whole idea.`}
]
};

for(let i=2;i<=10;i++){
  scenes[i] = [{html:'<div class="box dark">Scene '+i+'</div>',narr:'Scene content loads here.'}];
}

/* ============================================================
   STORY CHAPTERS
   ============================================================ */
const chapters = [
{
 n:1, title:"🏗️ Class and Object — the recipe card and the real cup",
 scene:`On day one, the tea recipe is written on a card and stuck near the stove.<br><br>
 A customer comes in. You read the card and make a cup. Another customer comes. You read the
 <b>same card</b> and make another cup. The card never runs out.<br><br>
 And here is the simple truth: <b>you cannot drink the card.</b> The card is instructions.
 The cup is the real thing.`,
 simple:`<b>In simple words:</b><br>
 A <b>class</b> is a plan. It is written once. It does nothing by itself.<br>
 An <b>object</b> is a real thing made from that plan. You can use it.<br><br>
 Plan = <span class="word">class Tea:</span> &nbsp;·&nbsp; Real thing = <span class="word">cup = Tea()</span>`,
 code:`class Tea:
    def serve(self):
        print("Here is your hot tea!")

cup = Tea()
cup.serve()`,
 out:`Here is your hot tea!`,
 lines:`<b>Line by line:</b><br>
 • <span class="word">class Tea:</span> — start writing the plan, name it Tea.<br>
 • <span class="word">def serve(self):</span> — one thing this cup can do.<br>
 • <span class="word">cup = Tea()</span> — the brackets <b>()</b> actually make a real cup.<br>
 • <span class="word">cup.serve()</span> — the dot means "this cup, do that thing".`,
 take:`A class alone does nothing. You must write <b>Tea()</b> with brackets to get a real object.`
}
];

function buildStory(){
  const c = document.getElementById('story-container');
  let html = `
  <div class="story-intro">
    <h2>☕ The Story of a Small Tea Shop</h2>
    <p>
      Someone opens a tiny tea shop near a bus stand. One kettle, one notebook, lots of enthusiasm.
      Six months later there are four branches — and without ever opening a textbook, the owner
      has learned every idea in Object-Oriented Programming.
    </p>
    <p>
      Each chapter below teaches <b>one idea</b>. Press <b>▶ Play</b> on the scene and it walks you
      through it step by step, with a sentence explaining each step. Then read the story, the simple
      meaning, and the code.
    </p>
  </div>`;

  chapters.forEach(ch => {
    html += `
    <div class="story-card">
      <div class="chapter">Chapter ${ch.n}</div>
      <h3>${ch.title}</h3>
      ${makePlayer(ch.n, scenes[ch.n])}
      <div class="scene">${ch.scene}</div>
      <div class="simple">${ch.simple}</div>
      <pre>${escapeHtml(ch.code)}</pre>
      <p class="out-note">Output:<br>${escapeHtml(ch.out).replace(/\n/g,'<br>')}</p>
      <div class="simple">${ch.lines}</div>
      <div class="takeaway"><b>Remember:</b> ${ch.take}</div>
    </div>`;
  });

  c.innerHTML = html;
  chapters.forEach(ch => renderStep(ch.n));
}

/* ============================================================
   QUIZ
   ============================================================ */
const questions = [
{
  id:1, level:"easy",
  title:"Q1. Make a class and an object",
  desc:"Write the recipe card, then make one real cup. Create a class <code>Tea</code> with a method <code>serve()</code> that prints the message. Then create <code>cup</code> and call the method.",
  goal:'Your program must print exactly: Here is your hot tea!',
  starter:`class Tea:
    def serve(self):
        pass

cup = Tea()
cup.serve()`,
  hints:[
    "Replace 'pass' with print(\"Here is your hot tea!\")",
    "Inside serve(), write a print with the message in quotes.",
  ],
  expected:"Here is your hot tea!",
  answerCode:`class Tea:
    def serve(self):
        print("Here is your hot tea!")

cup = Tea()
cup.serve()`,
  example:"Tea is the plan. cup = Tea() makes a real object. cup.serve() tells it to do its job."
}
];

function buildQuiz(){
  const container = document.getElementById('quiz-container');
  let html = '';
  
  questions.forEach(q => {
    const badgeClass = q.level === 'easy' ? 'badge-easy' : 'badge-medium';
    html += `
    <div class="card" id="q${q.id}">
      <h2 class="qtitle">${q.title} <span class="qbadge ${badgeClass}">${q.level}</span></h2>
      <p class="qdesc">${q.desc}</p>
      <div class="goal"><strong>Goal:</strong> ${q.goal}</div>
      <textarea id="code${q.id}" placeholder="Write your Python code here...">${q.starter}</textarea>
      <div class="btnrow">
        <button class="icon-btn hint-btn" onclick="toggleHint(${q.id})" title="Show hint">💡</button>
        <button class="icon-btn answer-btn" onclick="toggleAnswer(${q.id})" title="Show answer">📖</button>
        <button class="run-btn" onclick="runCode(${q.id})">▶ Run Code</button>
      </div>
      <div class="hintbox" id="hints${q.id}">
        <span class="hint-tag">HINT:</span><br>
        ${q.hints.map(h => h + '<br>').join('')}
      </div>
      <div class="answerbox" id="answer${q.id}">
        <span class="answer-tag">ANSWER:</span>
        <pre>${escapeHtml(q.answerCode)}</pre>
      </div>
      <div class="result" id="result${q.id}"></div>
    </div>`;
  });
  
  container.innerHTML = html;
}

function toggleHint(id){
  document.getElementById('hints'+id).style.display = 
    document.getElementById('hints'+id).style.display === 'none' ? 'block' : 'none';
}

function toggleAnswer(id){
  document.getElementById('answer'+id).style.display = 
    document.getElementById('answer'+id).style.display === 'none' ? 'block' : 'none';
}

function runCode(id){
  const code = document.getElementById('code'+id).value;
  const q = questions.find(x => x.id === id);
  const result = document.getElementById('result'+id);
  
  try {
    let output = '';
    const oldLog = console.log;
    console.log = function(...args){
      output += args.join(' ') + '\n';
    };
    
    eval(code);
    console.log = oldLog;
    
    const expected = q.expected.trim();
    const actual = output.trim();
    
    if(actual === expected){
      result.className = 'result ok';
      result.textContent = '✓ Correct! Output matches perfectly.';
      document.getElementById('q'+id).classList.add('solved');
      celebrateWin();
    } else {
      result.className = 'result err';
      result.textContent = `✗ Wrong!\nExpected:\n${expected}\n\nGot:\n${actual}`;
    }
  } catch(e){
    result.className = 'result err';
    result.textContent = `✗ Error:\n${e.message}`;
  }
  result.style.display = 'block';
}

// Initialize on load
window.addEventListener('load', ()=>{
  buildStory();
  buildQuiz();
});
</script>
